name: Deploy to Cloudflare Pages

# Builds the static export on GitHub Actions and uploads `out/` to the Cloudflare Pages project
# `christyjacob-dev` (a direct-upload project, so Cloudflare never builds anything itself).
#   push to main   -> production (christyjacob.dev)
#   pull request   -> preview at <branch>.christyjacob-dev.pages.dev, linked in a PR comment
# Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and the repo
# variable CLOUDFLARE_ACCOUNT_ID. Without the token the build still runs and the upload is skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload to Cloudflare Pages
        id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=christyjacob-dev
            --branch=${{ env.BRANCH }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-message="${{ github.event_name }} ${{ env.BRANCH }}"
            --commit-dirty=true

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "Built OK. Upload skipped: the CLOUDFLARE_API_TOKEN secret is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployed **${BRANCH}**: ${ALIAS:-$URL} (this deployment: ${URL})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          body="Preview: ${ALIAS:-$URL}"$'\n'"This commit: ${URL}"
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body "$body" \
            || gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
